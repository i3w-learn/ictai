<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Addition practice</title>
<!--
  A sample ICT App activity. An activity is ONE file like this, with its script and styles inside it.
  It runs in a closed box: no internet, no other files. When the student is done it tells the app:
      parent.postMessage({ ict: 'activity', type: 'done', score: 8, max: 10 }, '*')
  See docs/activities.md.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: #f6efe2; color: #1f1a3d; }
  main { width: min(36rem, 92vw); text-align: center; padding: 1.5rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .step { color: #5b557a; margin: 0 0 1.5rem; }
  .sum { font-size: 4rem; font-weight: 700; margin: 0 0 1.5rem; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  button { font: inherit; font-size: 2rem; font-weight: 600; padding: 1rem; border: 0; border-radius: 1.25rem; background: #fff; color: inherit; cursor: pointer; box-shadow: 0 6px 0 #d9cdb8; }
  button:hover { transform: translateY(-2px); }
  button.right { background: #bfe8cf; box-shadow: 0 6px 0 #7fc59d; }
  button.wrong { background: #f6c4c4; box-shadow: 0 6px 0 #d98b8b; }
  button:disabled { cursor: default; transform: none; }
  .again { margin-top: 1.5rem; font-size: 1.25rem; background: #7c5cf0; color: #fff; box-shadow: 0 6px 0 #5a3fc4; }
  .score { font-size: 3rem; font-weight: 700; margin: 0.5rem 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  var TOTAL = 10;
  var app = document.getElementById('app');
  var score, asked;

  function pick(n) { return Math.floor(Math.random() * n); }

  // Four different answers, one of them right, in a mixed-up order.
  function choices(right) {
    var set = [right];
    while (set.length < 4) {
      var near = right + pick(11) - 5;
      if (near >= 0 && set.indexOf(near) < 0) set.push(near);
    }
    return set.sort(function () { return Math.random() - 0.5; });
  }

  function question() {
    if (asked === TOTAL) return finish();
    asked += 1;
    var a = 1 + pick(20), b = 1 + pick(20), right = a + b;
    app.innerHTML = '<h1>Addition practice</h1><p class="step">Question ' + asked + ' of ' + TOTAL + '</p><p class="sum">' + a + ' + ' + b + ' = ?</p><div class="answers"></div>';
    var box = app.querySelector('.answers');
    choices(right).forEach(function (n) {
      var btn = document.createElement('button');
      btn.textContent = n;
      btn.onclick = function () {
        if (n === right) score += 1;
        Array.prototype.forEach.call(box.children, function (other) {
          other.disabled = true;
          if (Number(other.textContent) === right) other.className = 'right';
        });
        if (n !== right) btn.className = 'wrong';
        setTimeout(question, 900);
      };
      box.appendChild(btn);
    });
  }

  function finish() {
    app.innerHTML = '<h1>Well done!</h1><p class="score">' + score + ' of ' + TOTAL + '</p><p class="step">Your score has been sent to your teacher.</p><button class="again">Play again</button>';
    app.querySelector('.again').onclick = start;
    // This one line is what makes it an ICT App activity.
    parent.postMessage({ ict: 'activity', type: 'done', score: score, max: TOTAL }, '*');
  }

  function start() { score = 0; asked = 0; question(); }
  start();
</script>
</body>
</html>
