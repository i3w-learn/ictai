# Builds the two Windows installers on every push: ICT-Setup (Server PC, Smart board)
# and ICT-Student-Setup (student lab PCs).
# Tauri can't reliably build Windows apps on a Mac, so this runs on a Windows machine.
name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The Node shipped inside the installer (spec: Node 22 LTS). Must be >= 22.14:
  # better-sqlite3 13 is built against Node-API 10, and older 22.x crashes on open.
  NODE_VERSION: 22.23.4
  WINSW_VERSION: v2.12.0

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build client (Tauri, no bundle; Inno Setup packages it)
        run: pnpm --filter @ict/client tauri build --no-bundle

      # The key that opens our locked videos is the secret ICT_CONTENT_KEY. It is written into
      # server.cjs here and is nowhere in the code. No secret: the server is built without a key.
      - name: Build server bundle
        env:
          ICT_CONTENT_KEY: ${{ secrets.ICT_CONTENT_KEY }}
        run: pnpm --filter @ict/server build

      - name: Stage files
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force "$stage/client", "$stage/server/node_modules" | Out-Null
          Copy-Item apps/client/src-tauri/target/release/ict-client.exe "$stage/client/"
          Copy-Item server/dist/server.cjs "$stage/server/"
          Copy-Item installer/ict-server.xml "$stage/server/"
          # better-sqlite3 is native; the package ships prebuilt N-API binaries for Windows.
          Copy-Item -Recurse (Resolve-Path server/node_modules/better-sqlite3).Path "$stage/server/node_modules/better-sqlite3"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/win-x64/node.exe" -OutFile "$stage/server/node.exe"
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe" -OutFile "$stage/server/ict-server.exe"

      # Videos that come with the app. They are too big for the code, so they are kept as the files
      # of a GitHub release named "starter-videos" (in this repo, or in the repo named by the
      # STARTER_VIDEOS_REPO variable, read with the STARTER_VIDEOS_TOKEN secret when it is private).
      # No such release: the installer is built without videos.
      - name: Fetch starter videos
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STARTER_VIDEOS_TOKEN || github.token }}
          VIDEOS_REPO: ${{ vars.STARTER_VIDEOS_REPO || github.repository }}
        run: |
          New-Item -ItemType Directory -Force stage/server/starter-videos | Out-Null
          gh release download starter-videos --repo $env:VIDEOS_REPO --pattern "*.mp4" --pattern "*.webm" --pattern "*.pdf" --pattern "*.ictlock" --dir stage/server/starter-videos
          if ($LASTEXITCODE) { Write-Host "No starter videos or books found; building without them."; $global:LASTEXITCODE = 0 }
          Get-ChildItem stage/server/starter-videos | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      # No video or book leaves here in a form that plays outside the app: whatever came unlocked
      # is locked now, and the unlocked file is thrown away.
      - name: Lock the starter videos
        shell: pwsh
        env:
          ICT_CONTENT_KEY: ${{ secrets.ICT_CONTENT_KEY }}
        run: |
          $plain = @(Get-ChildItem stage/server/starter-videos -File | Where-Object { $_.Extension -in ".mp4", ".webm", ".pdf" })
          if ($plain.Count -eq 0) { "Nothing to lock."; exit 0 }
          if (!$env:ICT_CONTENT_KEY) { Write-Host "::warning::The secret ICT_CONTENT_KEY is not set, so $($plain.Count) starter file(s) go into the installer unlocked."; exit 0 }
          node installer/lock-videos.mjs stage/server/starter-videos
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plain | Remove-Item
          Get-ChildItem stage/server/starter-videos | ForEach-Object { $_.Name }

      - name: Smoke-test the staged server
        shell: pwsh
        run: |
          $env:ICT_DATA_DIR = "$env:RUNNER_TEMP/ictdata"
          $p = Start-Process stage/server/node.exe -ArgumentList "stage/server/server.cjs" -PassThru
          Start-Sleep 5
          curl.exe -k --fail https://localhost:7700/health
          Stop-Process $p.Id

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Server PC and Smart board.
          & $iscc /DStage="$PWD\stage" installer/ict-setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Student lab PCs: the same app, no questions and no server files.
          & $iscc /DStudentOnly /DStage="$PWD\stage" installer/ict-setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Setup
          path: installer/Output/ICT-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Student-Setup
          path: installer/Output/ICT-Student-Setup-*.exe

  # Installs the real installer on a clean Windows machine, the way a school would, and checks
  # that the server runs as a Windows service and that add-videos.bat puts a video in the library.
  install-test:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Only to lock a test video the way a real one is locked. Empty when the secret is not set.
      ICT_CONTENT_KEY: ${{ secrets.ICT_CONTENT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ICT-Setup
          path: setup

      - name: Install as a Server PC, with no questions
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup/ICT-Setup-*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/AdminPassword=admin-pass-1", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; exit $p.ExitCode }
          $server = "$env:ProgramFiles\ICT App\server"
          foreach ($f in "node.exe", "server.cjs", "ict-server.exe", "ict-server.xml") { if (!(Test-Path "$server\$f")) { throw "Missing after install: $f" } }
          if ((Get-Content "$env:ProgramFiles\ICT App\install-role.txt") -ne "console") { throw "The role file does not say console" }
          Get-Service ICTServer | Format-List Name, Status, StartType

      - name: The server runs as a Windows service
        shell: pwsh
        run: |
          $server = "$env:ProgramFiles\ICT App\server"
          $data = "$env:ProgramData\ICT App\server"
          foreach ($i in 1..30) {
            Start-Sleep 2
            curl.exe -k -s --fail https://localhost:7700/health
            if ($LASTEXITCODE -eq 0) { break }
          }
          if ($LASTEXITCODE) { Get-Content "$data\startup.log" -ErrorAction SilentlyContinue; Get-ChildItem $server; throw "The server did not start" }
          if ((Get-Service ICTServer).Status -ne "Running") { throw "The service is not running" }

      - name: Add a video with add-videos.bat
        shell: pwsh
        run: |
          $pack = "$env:RUNNER_TEMP\ICT App Windows"   # a space in the path, as in a real Downloads folder
          New-Item -ItemType Directory -Force "$pack\videos" | Out-Null
          Copy-Item installer/add-videos.bat "$pack\2-add-videos.bat"
          # A small file that begins the way an MP4 does.
          $bytes = [byte[]](0, 0, 0, 0x20) + [Text.Encoding]::ASCII.GetBytes("ftypisom") + (New-Object byte[] 4000)
          [IO.File]::WriteAllBytes("$pack\videos\G6-Mar-Mat-06Int11-Addition of Integers -Part 1-DMV-ILL.mp4", $bytes)
          cmd /c "`"$pack\2-add-videos.bat`" < nul"
          if ($LASTEXITCODE) { throw "add-videos.bat ended with $LASTEXITCODE" }
          if (!(Test-Path "$env:ProgramFiles\ICT App\server\starter-videos\*.mp4")) { throw "The video was not copied beside the server" }

      - name: The video is in the library and can be read
        shell: pwsh
        run: |
          $base = "https://localhost:7700"
          $items = @()
          foreach ($i in 1..30) {
            Start-Sleep 2
            try {
              $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
              $items = @(Invoke-RestMethod "$base/api/v1/content" -Headers @{ authorization = "Bearer $token" } -SkipCertificateCheck | ForEach-Object { $_ })
              if ($items.Count -gt 0) { break }
            } catch { Write-Host "not yet: $_" }
          }
          $items | Format-List title, kind, className, subject, size, mime
          if ($items.Count -ne 1) { Get-Content "$env:ProgramData\ICT App\server\events.log" -ErrorAction SilentlyContinue; throw "Expected 1 library item, found $($items.Count)" }
          $v = $items[0]
          if ($v.title -ne "Addition of Integers - Part 1" -or $v.className -ne "6" -or $v.subject -ne "Maths" -or $v.kind -ne "video") { $v | ConvertTo-Json; throw "The video was filed wrongly" }
          $code = curl.exe -k -s -o NUL -w "%{http_code}" -H "authorization: Bearer $token" -H "range: bytes=0-99" "$base/api/v1/files/$($v.fileHash)/raw"
          if ($code -ne "206") { throw "Reading the video gave $code" }
          Get-Content "$env:ProgramData\ICT App\server\events.log"

      - name: What the server wrote, if something above went wrong
        if: failure()
        shell: pwsh
        run: |
          $server = "$env:ProgramFiles\ICT App\server"
          $data = "$env:ProgramData\ICT App\server"
          Get-ChildItem $server, "$server\starter-videos", $data -ErrorAction SilentlyContinue | Format-Table FullName, Length
          foreach ($f in "$data\events.log", "$data\startup.log", "$data\starter-videos.json") { "--- $f"; Get-Content $f -ErrorAction SilentlyContinue }
          Get-ChildItem "$server\*.log" | ForEach-Object { "--- $($_.Name)"; Get-Content $_ -Tail 60 }

      - name: Running add-videos.bat again adds nothing twice
        shell: pwsh
        run: |
          cmd /c "`"$env:RUNNER_TEMP\ICT App Windows\2-add-videos.bat`" < nul"
          Start-Sleep 20
          $base = "https://localhost:7700"
          $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
          $items = @(Invoke-RestMethod "$base/api/v1/content" -Headers @{ authorization = "Bearer $token" } -SkipCertificateCheck | ForEach-Object { $_ })
          if ($items.Count -ne 1) { throw "Expected still 1 library item, found $($items.Count)" }

      # A video locked with our key: the app plays it, and the Server PC's disk never holds it unlocked.
      - name: A locked video plays in the app and stays locked on the disk
        if: env.ICT_CONTENT_KEY != ''
        shell: pwsh
        run: |
          $pack = "$env:RUNNER_TEMP\ICT App Windows"
          $name = "G7-Mar-Sci-07Lig02-Light and Shadow -Part 1-DMV-ILL.mp4"
          $plainDir = "$env:RUNNER_TEMP\unlocked"
          New-Item -ItemType Directory -Force $plainDir | Out-Null
          $rest = New-Object byte[] 300000
          [Random]::new(7).NextBytes($rest)
          $bytes = [byte[]]([byte[]](0, 0, 0, 0x20) + [Text.Encoding]::ASCII.GetBytes("ftypisom") + $rest)
          [IO.File]::WriteAllBytes("$plainDir\$name", $bytes)
          node installer/lock-videos.mjs $plainDir --out "$pack\videos"
          if ($LASTEXITCODE) { throw "lock-videos.mjs ended with $LASTEXITCODE" }
          cmd /c "`"$pack\2-add-videos.bat`" < nul"
          if ($LASTEXITCODE) { throw "add-videos.bat ended with $LASTEXITCODE" }
          if (!(Test-Path -LiteralPath "$env:ProgramFiles\ICT App\server\starter-videos\$name.ictlock")) { throw "The locked video was not copied beside the server" }

          $base = "https://localhost:7700"
          $v = $null
          foreach ($i in 1..30) {
            Start-Sleep 2
            try {
              $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
              $v = Invoke-RestMethod "$base/api/v1/content" -Headers @{ authorization = "Bearer $token" } -SkipCertificateCheck | ForEach-Object { $_ } | Where-Object { $_.title -eq "Light and Shadow - Part 1" }
              if ($v) { break }
            } catch { Write-Host "not yet: $_" }
          }
          if (!$v) { Get-Content "$env:ProgramData\ICT App\server\events.log" -ErrorAction SilentlyContinue; throw "The locked video is not in the library" }
          $v | Format-List title, kind, className, subject, size, mime, fileName
          if ($v.className -ne "7" -or $v.subject -ne "Science" -or $v.kind -ne "video" -or $v.size -ne $bytes.Length -or $v.fileName -ne $name) { throw "The locked video was filed wrongly" }

          # The app gets the real video back, byte for byte.
          curl.exe -k -s --fail -o "$env:RUNNER_TEMP\played.mp4" -H "authorization: Bearer $token" "$base/api/v1/files/$($v.fileHash)/raw"
          if ($LASTEXITCODE) { throw "Reading the locked video failed" }
          if ((Get-FileHash "$env:RUNNER_TEMP\played.mp4").Hash -ne (Get-FileHash -LiteralPath "$plainDir\$name").Hash) { throw "The app did not get the real video back" }

          # What the library keeps on the disk begins with the lock's mark, not with a video's.
          $kept = "$env:ProgramData\ICT App\server\files\$($v.fileHash.Substring(0, 2))\$($v.fileHash)"
          $head = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($kept), 0, 8)
          if ($head -ne "ICTLOCK1") { throw "The video on the server's disk is not locked (it begins '$head')" }

      # Word, Excel and PowerPoint files are turned into PDFs by LibreOffice, which a school installs on
      # the Server PC by itself. Install it here the same way, then add a real Word file.
      - name: Install LibreOffice
        id: office
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          if ($LASTEXITCODE -or !(Test-Path "$env:ProgramFiles\LibreOffice\program\soffice.com")) {
            Write-Host "::warning::LibreOffice could not be installed on this machine, so the Word file check was skipped."
            "ok=false" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
            exit 0
          }
          "ok=true" >> $env:GITHUB_OUTPUT

      - name: A Word file added to the library becomes a PDF
        if: steps.office.outputs.ok == 'true'
        shell: pwsh
        run: |
          $base = "https://localhost:7700"
          $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
          $h = @{ authorization = "Bearer $token" }
          $classId = @(Invoke-RestMethod "$base/api/v1/classes" -Headers $h -SkipCertificateCheck | ForEach-Object { $_ })[0].id
          if (!$classId) { throw "No class to file the Word file under" }
          $bytes = [IO.File]::ReadAllBytes("installer/test-files/hello.docx")
          try {
            $start = Invoke-RestMethod "$base/api/v1/content/uploads" -Method Post -Headers $h -ContentType "application/json" -Body (@{ fileName = "hello.docx"; size = $bytes.Length } | ConvertTo-Json) -SkipCertificateCheck
            Invoke-RestMethod "$base/api/v1/content/uploads/$($start.uploadId)/chunks" -Method Put -Headers $h -ContentType "application/json" -Body (@{ index = 0; data = [Convert]::ToBase64String($bytes) } | ConvertTo-Json) -SkipCertificateCheck
            # The first run of LibreOffice on a PC sets itself up, so this one call may take a minute.
            $item = Invoke-RestMethod "$base/api/v1/content/uploads/$($start.uploadId)/finish" -Method Post -Headers $h -ContentType "application/json" -Body (@{ title = "Hello from Word"; classId = $classId } | ConvertTo-Json) -SkipCertificateCheck -TimeoutSec 180
          } catch {
            Write-Host "The server said: $($_.ErrorDetails.Message)"
            Get-ChildItem "$env:ProgramData\ICT App\server" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Format-Table FullName, Length
            throw
          }
          $item | Format-List title, kind, mime, size, fileName
          if ($item.kind -ne "pdf" -or $item.mime -ne "application/pdf") { throw "The Word file was not filed as a PDF" }
          curl.exe -k -s --fail -o "$env:RUNNER_TEMP\hello.pdf" -H "authorization: Bearer $token" "$base/api/v1/files/$($item.fileHash)/raw"
          if ($LASTEXITCODE) { throw "Reading the PDF back failed" }
          $pdf = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\hello.pdf")
          if ([Text.Encoding]::ASCII.GetString($pdf, 0, 5) -ne "%PDF-") { throw "What came back is not a PDF" }
          "The PDF is $($pdf.Length) bytes."

      - name: Uninstall leaves no service behind
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\ICT App\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { exit $p.ExitCode }
          Start-Sleep 5
          if (Get-Service ICTServer -ErrorAction SilentlyContinue) { throw "The service is still there after uninstall" }
