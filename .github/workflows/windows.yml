# Builds the two Windows installers on every push: ICT-Setup (Server PC, Smart board)
# and ICT-Student-Setup (student lab PCs).
# Tauri can't reliably build Windows apps on a Mac, so this runs on a Windows machine.
name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The Node shipped inside the installer (spec: Node 22 LTS). Must be >= 22.14:
  # better-sqlite3 13 is built against Node-API 10, and older 22.x crashes on open.
  NODE_VERSION: 22.23.4
  WINSW_VERSION: v2.12.0

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build client (Tauri, no bundle; Inno Setup packages it)
        run: pnpm --filter @ict/client tauri build --no-bundle

      - name: Build server bundle
        run: pnpm --filter @ict/server build

      - name: Stage files
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force "$stage/client", "$stage/server/node_modules" | Out-Null
          Copy-Item apps/client/src-tauri/target/release/ict-client.exe "$stage/client/"
          Copy-Item server/dist/server.cjs "$stage/server/"
          Copy-Item installer/ict-server.xml "$stage/server/"
          # better-sqlite3 is native; the package ships prebuilt N-API binaries for Windows.
          Copy-Item -Recurse (Resolve-Path server/node_modules/better-sqlite3).Path "$stage/server/node_modules/better-sqlite3"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/win-x64/node.exe" -OutFile "$stage/server/node.exe"
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe" -OutFile "$stage/server/ict-server.exe"

      - name: Smoke-test the staged server
        shell: pwsh
        run: |
          $env:ICT_DATA_DIR = "$env:RUNNER_TEMP/ictdata"
          $p = Start-Process stage/server/node.exe -ArgumentList "stage/server/server.cjs" -PassThru
          Start-Sleep 5
          curl.exe -k --fail https://localhost:7700/health
          Stop-Process $p.Id

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Server PC and Smart board.
          & $iscc /DStage="$PWD\stage" installer/ict-setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Student lab PCs: the same app, no questions and no server files.
          & $iscc /DStudentOnly /DStage="$PWD\stage" installer/ict-setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Setup
          path: installer/Output/ICT-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Student-Setup
          path: installer/Output/ICT-Student-Setup-*.exe

  # Installs the real installer on a clean Windows machine, the way a school would, and checks
  # that the server runs as a Windows service and that add-videos.bat puts a video in the library.
  install-test:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ICT-Setup
          path: setup

      - name: Install as a Server PC, with no questions
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup/ICT-Setup-*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/AdminPassword=admin-pass-1", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; exit $p.ExitCode }
          $server = "$env:ProgramFiles\ICT App\server"
          foreach ($f in "node.exe", "server.cjs", "ict-server.exe", "ict-server.xml") { if (!(Test-Path "$server\$f")) { throw "Missing after install: $f" } }
          if ((Get-Content "$env:ProgramFiles\ICT App\install-role.txt") -ne "console") { throw "The role file does not say console" }
          Get-Service ICTServer | Format-List Name, Status, StartType

      - name: The server runs as a Windows service
        shell: pwsh
        run: |
          $server = "$env:ProgramFiles\ICT App\server"
          $data = "$env:ProgramData\ICT App\server"
          foreach ($i in 1..30) {
            Start-Sleep 2
            curl.exe -k -s --fail https://localhost:7700/health
            if ($LASTEXITCODE -eq 0) { break }
          }
          if ($LASTEXITCODE) { Get-Content "$data\startup.log" -ErrorAction SilentlyContinue; Get-ChildItem $server; throw "The server did not start" }
          if ((Get-Service ICTServer).Status -ne "Running") { throw "The service is not running" }

      - name: Add a video with add-videos.bat
        shell: pwsh
        run: |
          $pack = "$env:RUNNER_TEMP\ICT App Windows"   # a space in the path, as in a real Downloads folder
          New-Item -ItemType Directory -Force "$pack\videos" | Out-Null
          Copy-Item installer/add-videos.bat "$pack\2-add-videos.bat"
          # A small file that begins the way an MP4 does.
          $bytes = [byte[]](0, 0, 0, 0x20) + [Text.Encoding]::ASCII.GetBytes("ftypisom") + (New-Object byte[] 4000)
          [IO.File]::WriteAllBytes("$pack\videos\G6-Mar-Mat-06Int11-Addition of Integers -Part 1-DMV-ILL.mp4", $bytes)
          cmd /c "`"$pack\2-add-videos.bat`" < nul"
          if ($LASTEXITCODE) { throw "add-videos.bat ended with $LASTEXITCODE" }
          if (!(Test-Path "$env:ProgramFiles\ICT App\server\starter-videos\*.mp4")) { throw "The video was not copied beside the server" }

      - name: The video is in the library and can be read
        shell: pwsh
        run: |
          $base = "https://localhost:7700"
          $items = @()
          foreach ($i in 1..30) {
            Start-Sleep 2
            try {
              $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
              $items = @(Invoke-RestMethod "$base/api/v1/content" -Headers @{ authorization = "Bearer $token" } -SkipCertificateCheck | ForEach-Object { $_ })
              if ($items.Count -gt 0) { break }
            } catch { Write-Host "not yet: $_" }
          }
          $items | Format-List title, kind, className, subject, size, mime
          if ($items.Count -ne 1) { Get-Content "$env:ProgramData\ICT App\server\events.log" -ErrorAction SilentlyContinue; throw "Expected 1 library item, found $($items.Count)" }
          $v = $items[0]
          if ($v.title -ne "Addition of Integers - Part 1" -or $v.className -ne "6" -or $v.subject -ne "Maths" -or $v.kind -ne "video") { $v | ConvertTo-Json; throw "The video was filed wrongly" }
          $code = curl.exe -k -s -o NUL -w "%{http_code}" -H "authorization: Bearer $token" -H "range: bytes=0-99" "$base/api/v1/files/$($v.fileHash)/raw"
          if ($code -ne "206") { throw "Reading the video gave $code" }
          Get-Content "$env:ProgramData\ICT App\server\events.log"

      - name: Running add-videos.bat again adds nothing twice
        shell: pwsh
        run: |
          cmd /c "`"$env:RUNNER_TEMP\ICT App Windows\2-add-videos.bat`" < nul"
          Start-Sleep 20
          $base = "https://localhost:7700"
          $token = (Invoke-RestMethod "$base/api/v1/auth/staff" -Method Post -ContentType "application/json" -Body '{"username":"admin","password":"admin-pass-1"}' -SkipCertificateCheck).token
          $items = @(Invoke-RestMethod "$base/api/v1/content" -Headers @{ authorization = "Bearer $token" } -SkipCertificateCheck | ForEach-Object { $_ })
          if ($items.Count -ne 1) { throw "Expected still 1 library item, found $($items.Count)" }

      - name: Uninstall leaves no service behind
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\ICT App\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { exit $p.ExitCode }
          Start-Sleep 5
          if (Get-Service ICTServer -ErrorAction SilentlyContinue) { throw "The service is still there after uninstall" }
